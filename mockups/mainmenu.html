<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artemisa mock · Main menu alternatives</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  :root {
    --ink: #0B0D10; --s1: #14171C; --s2: #1C2027; --s3: #272C34; --s3f: #323842; --line: rgba(255,255,255,.14);
    --w: #FFFFFF; --t2: rgba(255,255,255,.74); --t3: rgba(255,255,255,.52);
    --go: #76D600; --on-go: #0A1200; --stop: #FF6B6E;
    --safe-x: 96px; --safe-y: 54px;
    --f: 'Albert Sans', sans-serif;
  }
  .screen { background: var(--ink); color: var(--w); font-family: var(--f); font-variant-numeric: tabular-nums; }
  .wash { position: absolute; inset: -80px; z-index: -3; background-size: cover; background-position: center; filter: blur(64px) brightness(.5) saturate(1.35); }
  .mosaic { position: absolute; inset: -80px; z-index: -3; display: flex; filter: blur(70px) brightness(.38) saturate(1.3); }
  .mosaic img { flex: 1; min-width: 0; height: 100%; object-fit: cover; }
  .ring { outline: 5px solid var(--go); outline-offset: 5px; }

  /* Shared bits */
  .round { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; flex: none; }
  .round .ic { font-size: 26px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--go); color: var(--on-go); display: grid; place-items: center; font-weight: 800; font-size: 24px; flex: none; }
  .clock { font-size: 28px; font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--go); flex: none; }
  .sep { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); flex: none; }
  .hints { display: flex; gap: 34px; font-size: 24px; font-weight: 600; color: var(--t2); }
  .hint { display: flex; align-items: center; gap: 12px; }
  .btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--ink); display: grid; place-items: center; font-size: 20px; font-weight: 800; }
  .btn .ic { font-size: 22px; }
  .meta { display: flex; gap: 14px; align-items: center; font-size: 26px; color: var(--t2); font-weight: 500; }
  .pill { height: 56px; padding: 0 22px 0 18px; border-radius: 28px; background: rgba(255,255,255,.1); display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; }
  .pill .ic { font-size: 26px; }
  .pill .ic.chev { font-size: 22px; color: var(--t2); }

  /* ---------- A · Dock ---------- */
  .a-title { position: absolute; left: var(--safe-x); top: var(--safe-y); right: var(--safe-x); display: flex; align-items: center; gap: 16px; }
  .a-title .push { margin-left: auto; }
  .a-hero { position: absolute; left: var(--safe-x); bottom: 470px; width: 1100px; }
  .a-hero h1 { margin: 0; font-size: 84px; line-height: .98; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; }
  .a-hero .meta { margin-top: 20px; }
  .a-key { position: absolute; right: 0; top: 0; width: 900px; height: 700px; object-fit: cover; object-position: top; z-index: -2;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 50%), linear-gradient(0deg, transparent 0, #000 45%);
    -webkit-mask-composite: source-in; mask-composite: intersect; opacity: .9; }
  .a-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(11,13,16,.85) 0%, rgba(11,13,16,.4) 50%, rgba(11,13,16,0) 80%); }
  .dock { position: absolute; left: 48px; right: 48px; bottom: 0; height: 424px; border-radius: 28px 28px 0 0; background: rgba(20,23,28,.94);
    padding: 40px 48px 0; box-shadow: 0 -30px 80px -30px rgba(0,0,0,.8); }
  .dock-head { display: flex; align-items: center; gap: 14px; font-size: 28px; }
  .dock-head b { font-weight: 800; }
  .dock-head .sub { color: var(--t2); font-weight: 500; }
  .dock-head .push { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .cards { display: flex; gap: 20px; margin-top: 30px; }
  .gcard { width: 264px; height: 200px; border-radius: 16px; background: var(--s3); position: relative; overflow: hidden; flex: none; }
  .gcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .gcard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(14,16,20,.97) 0%, rgba(14,16,20,.85) 40%, rgba(14,16,20,0) 75%); }
  .gcard .lbl { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; }
  .gcard .lbl b { display: block; font-size: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gcard .lbl span { display: block; margin-top: 4px; font-size: 20px; color: var(--t2); }
  .gcard.util { background: var(--s2); display: flex; flex-direction: column; justify-content: space-between; padding: 22px 20px 18px; width: 200px; }
  .gcard.util::after { display: none; }
  .gcard.util .ic { font-size: 36px; color: var(--t2); }
  .gcard.util b { font-size: 24px; font-weight: 700; }
  .gcard.util span { display: block; margin-top: 4px; font-size: 20px; color: var(--t2); }
  .gcard.pc { width: 360px; background: var(--s3); display: flex; flex-direction: column; justify-content: space-between; padding: 24px 22px 20px; }
  .gcard.pc::after { display: none; }
  .gcard.pc .ic { font-size: 48px; }
  .gcard.pc b { font-size: 28px; font-weight: 800; }
  .gcard.pc span { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 22px; color: var(--t2); }
  .gcard.pc span .dot { width: 10px; height: 10px; }
  .vr { width: 2px; background: var(--line); margin: 16px 8px; flex: none; }
  .dock .hints { position: absolute; right: 48px; bottom: 34px; }

  /* ---------- B · Spotlight ---------- */
  .b-top { position: absolute; left: var(--safe-x); right: var(--safe-x); top: var(--safe-y); display: flex; align-items: center; gap: 16px; }
  .b-top .push { margin-left: auto; }
  .wordmark { font-size: 30px; font-weight: 800; letter-spacing: -.01em; margin-right: 18px; display: flex; align-items: center; gap: 12px; }
  .wordmark img { width: 44px; height: 44px; border-radius: 10px; }
  .b-vign { position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 70% 60% at 50% 45%, rgba(11,13,16,0) 0%, rgba(11,13,16,.75) 100%); }
  .carousel { position: absolute; left: 0; right: 0; top: 170px; height: 480px; }
  .cv { position: absolute; top: 50%; border-radius: 16px; overflow: hidden; background: var(--s3); transform: translate(-50%, -50%); box-shadow: 0 30px 60px -20px rgba(0,0,0,.85); }
  .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cv.f { width: 336px; height: 448px; border-radius: 20px; left: 960px; z-index: 3; }
  .cv.n1 { width: 252px; height: 336px; z-index: 2; opacity: .62; }
  .cv.n2 { width: 210px; height: 280px; z-index: 1; opacity: .3; }
  .cv.sq { display: grid; place-items: center; background: linear-gradient(160deg, #2E343D, #1B1F25); }
  .cv.sq .ic { font-size: 120px; }
  .cv.sq.add .ic { font-size: 72px; color: var(--t2); }
  .b-info { position: absolute; left: 0; right: 0; top: 690px; text-align: center; }
  .b-info h1 { margin: 0; font-size: 64px; font-weight: 800; letter-spacing: -.02em; line-height: 1.02; }
  .b-info .meta { justify-content: center; margin-top: 16px; }
  .b-info .acts { display: flex; justify-content: center; gap: 18px; margin-top: 34px; }
  .playpill { height: 80px; padding: 0 44px 0 34px; border-radius: 40px; background: var(--w); color: var(--ink); display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
  .playpill .ic { font-size: 28px; }
  .cbtn { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; }
  .cbtn .ic { font-size: 32px; }
  .dots { position: absolute; left: 0; right: 0; top: 662px; display: flex; justify-content: center; gap: 10px; }
  .dots i { width: 10px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.3); display: block; }
  .dots i.on { width: 32px; background: var(--w); }
  .screen > .hints { position: absolute; right: var(--safe-x); bottom: var(--safe-y); }

  /* ---------- C · Title list ---------- */
  .c-wash { position: absolute; inset: -80px -80px -80px 760px; z-index: -3; background-size: cover; background-position: center; filter: blur(70px) brightness(.5) saturate(1.3); }
  .c-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, var(--ink) 0%, var(--ink) 40%, rgba(11,13,16,.2) 70%, rgba(11,13,16,0) 100%); }
  .c-left { position: absolute; left: var(--safe-x); top: var(--safe-y); width: 820px; bottom: var(--safe-y); display: flex; flex-direction: column; }
  .c-head { display: flex; align-items: center; gap: 16px; }
  .c-head .sub { font-size: 24px; color: var(--t2); display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .c-list { margin-top: 64px; display: flex; flex-direction: column; gap: 6px; }
  .row { height: 88px; border-radius: 18px; padding: 0 28px; display: flex; align-items: center; gap: 22px; font-size: 36px; font-weight: 700; color: var(--t2); white-space: nowrap; }
  .row .t { overflow: hidden; text-overflow: ellipsis; }
  .row .ic { font-size: 34px; flex: none; }
  .row .thumb { width: 44px; height: 58px; border-radius: 6px; object-fit: cover; flex: none; opacity: .8; }
  .row .desk { width: 44px; height: 58px; border-radius: 6px; background: var(--s3); display: grid; place-items: center; flex: none; }
  .row .desk .ic { font-size: 24px; }
  .row.on { background: var(--w); color: var(--ink); }
  .row.on .thumb { opacity: 1; }
  .row .tail { margin-left: auto; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .row.on .tail { color: var(--ink); }
  .row .tail .btn { background: var(--ink); color: var(--w); width: 34px; height: 34px; font-size: 17px; }
  .c-util { margin-top: auto; display: flex; gap: 14px; }
  .c-util .u { height: 60px; padding: 0 22px; border-radius: 30px; background: rgba(255,255,255,.08); display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; color: var(--t2); }
  .c-util .u .ic { font-size: 24px; }
  .c-poster { position: absolute; left: 1140px; top: 130px; width: 600px; height: 800px; border-radius: 22px; object-fit: cover; box-shadow: 0 50px 90px -30px rgba(0,0,0,.9); }
  .c-meta { position: absolute; left: 1140px; width: 600px; top: 960px; justify-content: center; }
  .c-top { position: absolute; right: var(--safe-x); top: var(--safe-y); display: flex; gap: 16px; align-items: center; }
  .c-pcpanel { position: absolute; left: 1140px; top: 230px; width: 600px; height: 600px; border-radius: 28px; background: rgba(28,32,39,.9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .c-pcpanel > .ic { font-size: 180px; }
  .c-pcpanel b { font-size: 48px; font-weight: 800; }
  .c-pcpanel .meta { font-size: 24px; }
</style>
<script src="assets/mock.js"></script>
</head>
