<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artemisa mock · Library layouts</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  :root {
    --ink: #0B0D10; --s1: #14171C; --s2: #1C2027; --s3: #272C34; --s3f: #323842; --line: rgba(255,255,255,.12);
    --w: #FFFFFF; --t2: rgba(255,255,255,.74); --t3: rgba(255,255,255,.52);
    --go: #76D600; --on-go: #0A1200;
    --safe-x: 96px; --safe-y: 54px;
    --f: 'Albert Sans', sans-serif;
  }
  .screen { background: var(--ink); color: var(--w); font-family: var(--f); font-variant-numeric: tabular-nums; }
  .wash { position: absolute; inset: -80px; z-index: -3; background-size: cover; background-position: center; filter: blur(64px) brightness(.45) saturate(1.35); }
  .vign { position: absolute; inset: 0; z-index: -2; background: radial-gradient(ellipse 75% 65% at 50% 42%, rgba(11,13,16,.1) 0%, rgba(11,13,16,.88) 100%); }
  .ring { outline: 5px solid var(--go); outline-offset: 5px; }

  /* Shared chrome, as on the Spotlight library */
  .top { position: absolute; left: var(--safe-x); right: var(--safe-x); top: var(--safe-y); display: flex; align-items: center; gap: 16px; }
  .top .push { margin-left: auto; }
  .logo { width: 56px; height: 56px; border-radius: 12px; }
  .pill { height: 56px; padding: 0 22px 0 18px; border-radius: 28px; background: rgba(255,255,255,.1); display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; }
  .pill .ic { font-size: 26px; }
  .pill .ic.chev { font-size: 22px; color: var(--t2); }
  .round { width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; }
  .round .ic { font-size: 28px; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--go); color: var(--on-go); display: grid; place-items: center; }
  .avatar .ic { font-size: 28px; }
  .clock { font-size: 28px; font-weight: 600; margin-left: 8px; }
  .hints { position: absolute; right: var(--safe-x); bottom: var(--safe-y); display: flex; gap: 34px; font-size: 24px; font-weight: 600; color: var(--t2); }
  .hint { display: flex; align-items: center; gap: 12px; }
  .btn { min-width: 40px; height: 40px; padding: 0 10px; border-radius: 20px; background: rgba(255,255,255,.9); color: var(--ink); display: grid; place-items: center; font-size: 20px; font-weight: 800; }
  .btn .ic { font-size: 22px; }
  .meta { display: flex; gap: 14px; align-items: center; font-size: 26px; color: var(--t2); font-weight: 500; }
  .sep { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); }
  .play { height: 88px; padding: 0 46px 0 36px; border-radius: 44px; background: var(--w); color: var(--ink); display: inline-flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; }
  .play .ic { font-size: 28px; }
  .circle { width: 88px; height: 88px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; }
  .circle .ic { font-size: 34px; }
  .acts { display: flex; gap: 16px; align-items: center; }
  .cover { border-radius: 16px; overflow: hidden; background: var(--s3); position: relative; box-shadow: 0 24px 50px -20px rgba(0,0,0,.85); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover.desk { display: grid; place-items: center; background: linear-gradient(160deg, #2E343D, #1B1F25); }
  .cover.desk .ic { font-size: 64px; color: var(--t2); }
  .cover .badge { position: absolute; top: 12px; right: 12px; height: 34px; padding: 0 12px; border-radius: 17px; background: var(--go); color: var(--on-go); font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; }

  /* ---------- A · Grid ---------- */
  .grid { position: absolute; left: var(--safe-x); top: 170px; display: grid; grid-template-columns: repeat(4, 240px); gap: 30px 28px; }
  .grid .cover { width: 240px; height: 320px; }
  .grid .name { margin-top: 12px; font-size: 22px; font-weight: 600; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 240px; }
  .grid .f .name { color: var(--w); }
  .side { position: absolute; left: 1220px; right: var(--safe-x); top: 170px; }
  .side .poster { width: 300px; height: 400px; }
  .side h1 { margin: 30px 0 0; font-size: 48px; font-weight: 800; letter-spacing: -.02em; line-height: 1.04; }
  .side .meta { margin-top: 14px; }
  .side .acts { margin-top: 30px; }
  .count { position: absolute; left: var(--safe-x); bottom: 64px; font-size: 24px; color: var(--t3); font-weight: 600; }

  /* ---------- B · Showcase ---------- */
  .hero-cover { position: absolute; left: 0; top: 0; bottom: 0; width: 820px; z-index: -1;
    -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent 100%); mask-image: linear-gradient(90deg, #000 55%, transparent 100%); }
  .hero-cover img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  .hero-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(11,13,16,.95) 0%, rgba(11,13,16,0) 45%); }
  .b-top { left: auto; }
  .b-info { position: absolute; left: 860px; right: var(--safe-x); top: 200px; }
  .b-info h1 { margin: 0; font-size: 76px; font-weight: 800; letter-spacing: -.025em; line-height: 1; text-wrap: balance; }
  .b-info .meta { margin-top: 20px; }
  .b-info .acts { margin-top: 36px; }
  .b-info .last { margin-top: 26px; font-size: 24px; color: var(--t3); font-weight: 500; }
  .strip { position: absolute; left: var(--safe-x); right: var(--safe-x); bottom: 120px; display: flex; gap: 22px; align-items: flex-end; }
  .strip .cover { width: 150px; height: 200px; border-radius: 12px; }
  .strip .cover.f { width: 168px; height: 224px; }
  .strip-label { position: absolute; left: var(--safe-x); bottom: 356px; font-size: 26px; font-weight: 700; color: var(--t2); }

  /* ---------- C · Title list ---------- */
  .c-wash { position: absolute; inset: -80px -80px -80px 760px; z-index: -3; background-size: cover; background-position: center; filter: blur(70px) brightness(.5) saturate(1.3); }
  .c-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, var(--ink) 0%, var(--ink) 40%, rgba(11,13,16,.2) 70%, rgba(11,13,16,0) 100%); }
  .c-list { position: absolute; left: var(--safe-x); top: 180px; width: 860px; display: flex; flex-direction: column; gap: 6px; }
  .row { height: 92px; border-radius: 18px; padding: 0 26px; display: flex; align-items: center; gap: 22px; font-size: 36px; font-weight: 700; color: var(--t2); white-space: nowrap; }
  .row .t { overflow: hidden; text-overflow: ellipsis; }
  .row .thumb { width: 46px; height: 62px; border-radius: 6px; object-fit: cover; flex: none; opacity: .85; }
  .row .desk { width: 46px; height: 62px; border-radius: 6px; background: var(--s3); display: grid; place-items: center; flex: none; }
  .row .desk .ic { font-size: 24px; }
  .row.on { background: var(--w); color: var(--ink); }
  .row .tail { margin-left: auto; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .row .tail .btn { background: var(--ink); color: var(--w); min-width: 34px; height: 34px; font-size: 17px; }
  .c-poster { position: absolute; left: 1170px; top: 150px; width: 540px; height: 720px; }
  .c-meta { position: absolute; left: 1170px; width: 540px; top: 892px; justify-content: center; }

  /* ---------- Settings: choosing a layout ---------- */
  .tabs { position: absolute; left: var(--safe-x); top: 150px; display: flex; align-items: center; gap: 44px; font-size: 30px; font-weight: 700; color: var(--t3); }
  .tabs .on { color: var(--w); position: relative; }
  .tabs .on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -14px; height: 5px; border-radius: 3px; background: var(--w); }
  .tabs .btn { font-size: 18px; height: 36px; min-width: 52px; border-radius: 10px; background: rgba(255,255,255,.16); color: var(--w); }
  .s-list { position: absolute; left: var(--safe-x); top: 250px; width: 1060px; display: flex; flex-direction: column; gap: 4px; opacity: .5; }
  .crow { height: 92px; border-radius: 18px; padding: 0 28px; display: flex; align-items: center; font-size: 28px; font-weight: 600; }
  .crow .end { margin-left: auto; color: var(--t2); }
  .guide { position: absolute; right: var(--safe-x); top: 250px; width: 600px; bottom: 110px; background: var(--s2); border-radius: 28px; padding: 40px 42px; }
  .guide .k { font-size: 22px; color: var(--t3); font-weight: 600; }
  .guide h3 { margin: 8px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .guide p { margin: 14px 0 0; font-size: 23px; line-height: 1.5; color: var(--t2); }
  .opts { margin-top: 22px; display: flex; flex-direction: column; gap: 4px; }
  .opt { height: 68px; border-radius: 14px; padding: 0 18px; display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; color: var(--t2); }
  .opt .rd { width: 26px; height: 26px; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); flex: none; }
  .opt.sel { color: var(--w); }
  .opt.sel .rd { border: 8px solid var(--w); }
  .opt.f { background: var(--go); color: var(--on-go); }
  .opt.f .rd { border-color: var(--on-go); }
  .opt .mini { margin-left: auto; display: flex; gap: 4px; opacity: .8; }
  .opt .mini i { display: block; background: currentColor; border-radius: 2px; }
</style>
<script src="assets/mock.js"></script>
</head>
<body>
<header class="gallery-head">
  <h1>Library layouts</h1>
  <p>Three alternatives to Spotlight, chosen in Settings → Library. All use the same top bar, Play button, focus ring and controller hints.</p>
</header>

<!-- ===================== A · GRID ===================== -->
<figure class="frame"><figcaption>A · Grid</figcaption>
<div class="screen" id="grid">
  <div class="wash" style="background-image:url(assets/fatal-frame.jpg)"></div><div class="vign"></div>
  <div class="top"><img class="logo" src="assets/icon.png" alt=""><div class="pill"><i data-i="monitor"></i>VaporZPC<i class="chev" data-i="down"></i></div><div class="push"></div>
    <div class="round"><i data-i="settings"></i></div><div class="avatar"><i data-i="user"></i></div><span class="clock">21:47</span></div>
  <div class="grid">
    <div><div class="cover"><img src="assets/quiet-place.jpg" alt=""></div><div class="name">A Quiet Place: The Road Ahead</div></div>
    <div><div class="cover desk"><i data-i="monitor"></i></div><div class="name">Desktop</div></div>
    <div class="f"><div class="cover ring"><img src="assets/fatal-frame.jpg" alt=""></div><div class="name">Fatal Frame II: Crimson Butterfly Remake</div></div>
    <div><div class="cover"><img src="assets/star-rail.jpg" alt=""></div><div class="name">Honkai: Star Rail</div></div>
    <div><div class="cover"><img src="assets/outer-wilds.jpg" alt=""></div><div class="name">Outer Wilds</div></div>
  </div>
  <div class="side">
    <h1 style="margin-top:0">Fatal Frame II: Crimson Butterfly Remake</h1>
    <div class="meta">4K<span class="sep"></span>60 FPS<span class="sep"></span>HDR<span class="sep"></span>80 Mbps</div>
    <div class="acts"><div class="play"><i data-i="play"></i>Play</div><div class="circle"><i data-i="more"></i></div></div>
  </div>
  <div class="hints"><span class="hint"><span class="btn">A</span>Play</span><span class="hint"><span class="btn"><i data-i="menu"></i></span>Options</span><span class="hint"><span class="btn">B</span>Back</span></div>
</div></figure>

<!-- ===================== B · SHOWCASE ===================== -->
<figure class="frame"><figcaption>B · Showcase</figcaption>
<div class="screen" id="showcase">
  <div class="wash" style="background-image:url(assets/fatal-frame.jpg)"></div>
  <div class="hero-cover"><img src="assets/fatal-frame.jpg" alt=""></div>
  <div class="hero-shade"></div>
  <div class="top b-top" style="left:860px"><div class="pill"><i data-i="monitor"></i>VaporZPC<i class="chev" data-i="down"></i></div><div class="push"></div>
    <div class="round"><i data-i="settings"></i></div><div class="avatar"><i data-i="user"></i></div><span class="clock">21:47</span></div>
  <div class="b-info">
    <h1>Fatal Frame II: Crimson Butterfly Remake</h1>
    <div class="meta">4K<span class="sep"></span>60 FPS<span class="sep"></span>HDR<span class="sep"></span>80 Mbps</div>
    <div class="acts"><div class="play"><i data-i="play"></i>Play</div><div class="circle"><i data-i="more"></i></div></div>
  </div>
  <div class="strip-label">Your games</div>
  <div class="strip">
    <div class="cover"><img src="assets/quiet-place.jpg" alt=""></div>
    <div class="cover desk"><i data-i="monitor"></i></div>
    <div class="cover f ring"><img src="assets/fatal-frame.jpg" alt=""></div>
    <div class="cover"><img src="assets/star-rail.jpg" alt=""></div>
    <div class="cover"><img src="assets/outer-wilds.jpg" alt=""></div>
  </div>
  <div class="hints"><span class="hint"><span class="btn">A</span>Play</span><span class="hint"><span class="btn"><i data-i="menu"></i></span>Options</span><span class="hint"><span class="btn">B</span>Back</span></div>
</div></figure>

<!-- ===================== C · TITLE LIST ===================== -->
<figure class="frame"><figcaption>C · Title list</figcaption>
<div class="screen" id="list">
  <div class="c-wash" style="background-image:url(assets/fatal-frame.jpg)"></div><div class="c-shade"></div>
  <div class="top"><img class="logo" src="assets/icon.png" alt=""><div class="pill"><i data-i="monitor"></i>VaporZPC<i class="chev" data-i="down"></i></div><div class="push"></div>
    <div class="round"><i data-i="settings"></i></div><div class="avatar"><i data-i="user"></i></div><span class="clock">21:47</span></div>
  <div class="c-list">
    <div class="row"><img class="thumb" src="assets/quiet-place.jpg" alt=""><span class="t">A Quiet Place: The Road Ahead</span></div>
    <div class="row"><span class="desk"><i data-i="monitor"></i></span><span class="t">Desktop</span></div>
    <div class="row on"><img class="thumb" src="assets/fatal-frame.jpg" alt=""><span class="t">Fatal Frame II: Crimson Butterfly…</span><span class="tail"><span class="btn">A</span>Play</span></div>
    <div class="row"><img class="thumb" src="assets/star-rail.jpg" alt=""><span class="t">Honkai: Star Rail</span></div>
    <div class="row"><img class="thumb" src="assets/outer-wilds.jpg" alt=""><span class="t">Outer Wilds</span></div>
  </div>
  <div class="cover c-poster"><img src="assets/fatal-frame.jpg" alt=""></div>
  <div class="meta c-meta">4K<span class="sep"></span>60 FPS<span class="sep"></span>HDR<span class="sep"></span>80 Mbps</div>
  <div class="hints"><span class="hint"><span class="btn"><i data-i="menu"></i></span>Options</span><span class="hint"><span class="btn">B</span>Back</span></div>
</div></figure>

<!-- ===================== SETTINGS ===================== -->
<figure class="frame"><figcaption>Choosing the layout in Settings → Library</figcaption>
<div class="screen" id="setting">
  <div class="top"><img class="logo" src="assets/icon.png" alt=""><span style="font-size:44px;font-weight:800;letter-spacing:-.02em">Settings</span><div class="push"></div><span class="clock">21:47</span></div>
  <div class="tabs"><span class="btn">LB</span><span>Video</span><span>Audio and host</span><span>Controller</span><span>Overlay</span><span class="on">Library</span><span>System</span><span class="btn">RB</span></div>
  <div class="s-list">
    <div class="crow" style="background:var(--s3)">Library layout<span class="end">Spotlight</span></div>
    <div class="crow">Quick menu opacity<span class="end">100%</span></div>
  </div>
  <div class="guide">
    <div class="k">Library</div>
    <h3>Library layout</h3>
    <div class="opts">
      <div class="opt sel"><span class="rd"></span>Spotlight</div>
      <div class="opt f"><span class="rd"></span>Grid</div>
      <div class="opt"><span class="rd"></span>Showcase</div>
      <div class="opt"><span class="rd"></span>Title list</div>
    </div>
    <p>Every game at once, four to a row, with the focused game's details and Play beside the grid. Quickest to scan a big library.</p>
  </div>
  <div class="hints"><span class="hint"><span class="btn">A</span>Choose</span><span class="hint"><span class="btn">B</span>Cancel</span></div>
</div></figure>
</body>
</html>
